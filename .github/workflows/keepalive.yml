# Pings the live site twice a week so a free-tier Supabase project
# isn't paused for inactivity during quiet periods.
# Set the repository variable SITE_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://madras-cloth-emporium.netlify.app
name: keep-alive

on:
  schedule:
    - cron: "17 3 * * 1,4" # 03:17 UTC every Monday and Thursday
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 30 "${{ vars.SITE_URL }}/api/health"
